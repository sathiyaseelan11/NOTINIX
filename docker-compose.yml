version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: notinix_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: notinix_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/notinix
      - JWT_SECRET=your_jwt_secret_dev_key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/usr/src/app/uploads

  client:
    build: ./client
    container_name: notinix_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
